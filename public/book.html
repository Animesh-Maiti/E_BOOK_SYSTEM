<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Read book details, reviews, and access options on LibraHub.">
  <title>Book Details - LibraHub</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('librahub-theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    :root {
      --book-blue: #315efb;
      --book-muted: #64748b;
      --book-line: #e5eaf2;
      --book-radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--theme-bg);
      color: var(--theme-text);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .book-main {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 76px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: var(--theme-accent);
      font-weight: 800;
      text-decoration: none;
    }

    .book-hero {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: clamp(28px, 6vw, 70px);
      padding: clamp(24px, 5vw, 52px);
      border: 1px solid var(--theme-border);
      border-radius: 28px;
      background: var(--theme-surface);
      box-shadow: var(--theme-shadow);
    }

    .cover-frame {
      position: relative;
      display: grid;
      min-height: 390px;
      place-items: center;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, #eaf1ff, #f8f1e8);
      box-shadow: 0 18px 36px rgba(20, 33, 61, .14);
      transform: rotate(-2deg);
      transition: transform .35s ease, box-shadow .35s ease;
    }

    [data-theme="dark"] .cover-frame {
      background: linear-gradient(145deg, #26365c, #283141);
      box-shadow: 0 20px 42px rgba(0, 0, 0, .3);
    }

    .cover-frame:hover {
      box-shadow: 0 24px 48px rgba(20, 33, 61, .2);
      transform: rotate(0) translateY(-4px);
    }

    .cover-frame img {
      width: 100%;
      max-height: 350px;
      border-radius: 11px;
      object-fit: cover;
    }

    .cover-placeholder {
      color: #31518d;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.2rem;
      line-height: 1.04;
      text-align: center;
    }

    [data-theme="dark"] .cover-placeholder { color: #dbe5ff; }

    .book-kicker {
      margin: 0 0 12px;
      color: var(--book-blue);
      font-size: .77rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .book-hero h1 {
      margin: 0;
      color: var(--theme-text);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.35rem, 5vw, 4.4rem);
      letter-spacing: -.055em;
      line-height: 1.03;
    }

    .book-byline {
      margin: 14px 0 0;
      color: var(--theme-muted);
      font-size: 1.03rem;
    }

    .book-byline strong { color: var(--theme-text); }

    .rating-summary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 20px;
      padding: 8px 12px;
      border: 1px solid var(--theme-border);
      border-radius: 999px;
      background: var(--theme-elevated);
    }

    .rating-stars { color: #d88a16; letter-spacing: .06em; }
    .rating-summary span:last-child { color: var(--theme-muted); font-size: .82rem; }

    .book-description {
      max-width: 680px;
      margin: 24px 0 0;
      color: var(--theme-muted);
      font-size: 1.02rem;
      line-height: 1.75;
    }

    .book-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .book-action {
      min-height: 46px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: var(--theme-accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .book-action.secondary {
      border-color: var(--theme-border);
      background: transparent;
      color: var(--theme-text);
    }

    .book-action.bookmarked {
      border-color: rgba(49, 94, 251, .35);
      background: var(--theme-elevated);
      color: var(--theme-accent);
    }

    .action-note {
      margin: 12px 0 0;
      color: var(--theme-muted);
      font-size: .8rem;
    }

    .info-section,
    .reviews-section {
      margin-top: 28px;
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid var(--theme-border);
      border-radius: var(--book-radius);
      background: var(--theme-surface);
      box-shadow: var(--theme-shadow);
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--theme-text);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      letter-spacing: -.04em;
    }

    .section-heading p { margin: 5px 0 0; color: var(--theme-muted); }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metadata-item {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--theme-border);
      border-radius: 12px;
      background: var(--theme-elevated);
    }

    .metadata-label {
      display: block;
      margin-bottom: 5px;
      color: var(--theme-muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .metadata-value {
      display: block;
      overflow-wrap: anywhere;
      color: var(--theme-text);
      font-weight: 700;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 20px;
    }

    .keyword {
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--theme-elevated);
      color: var(--theme-muted);
      font-size: .78rem;
    }

    .review-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 13px;
      background: var(--theme-elevated);
    }

    .review-average { color: #d88a16; font-size: 1.15rem; font-weight: 800; }
    .review-count { color: var(--theme-muted); font-size: .86rem; }
    .review-list { display: grid; gap: 12px; margin-top: 18px; }

    .review-card {
      padding: 18px;
      border: 1px solid var(--theme-border);
      border-radius: 14px;
      background: var(--theme-bg);
    }

    .review-card-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
    }

    .reviewer { color: var(--theme-text); font-weight: 800; }
    .review-date { color: var(--theme-muted); font-size: .78rem; }
    .review-rating { margin-top: 7px; color: #d88a16; font-size: .86rem; font-weight: 800; }
    .review-text { margin: 12px 0 0; color: var(--theme-muted); line-height: 1.65; }
    .review-actions { display: flex; gap: 8px; margin-top: 14px; }
    .review-actions button { padding: 7px 10px; border: 1px solid var(--theme-border); border-radius: 8px; background: transparent; color: var(--theme-text); cursor: pointer; font-size: .78rem; }

    .review-empty {
      padding: 26px;
      border: 1px dashed var(--theme-border);
      border-radius: 13px;
      color: var(--theme-muted);
      text-align: center;
    }

    .review-form {
      display: grid;
      gap: 13px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--theme-border);
    }

    .review-form h3 { margin: 0; color: var(--theme-text); font-size: 1.05rem; }
    .star-picker { display: flex; gap: 4px; }
    .star-option {
      min-width: 38px;
      min-height: 38px;
      padding: 0;
      border: 1px solid var(--theme-border);
      border-radius: 9px;
      background: var(--theme-input);
      color: var(--theme-muted);
      cursor: pointer;
      font-size: 1.05rem;
    }

    .star-option.selected,
    .star-option:hover { border-color: #e4a32d; background: rgba(228, 163, 45, .12); color: #d88a16; }
    .review-form textarea { min-height: 116px; resize: vertical; }
    .review-form button[type="submit"] { justify-self: start; }
    .form-feedback { min-height: 20px; margin: 0; font-size: .84rem; }
    .form-feedback.success { color: #16805b; }
    .form-feedback.error { color: #c24141; }
    .login-review { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--theme-border); color: var(--theme-muted); }

    @media (max-width: 820px) {
      .book-hero { grid-template-columns: 210px minmax(0, 1fr); gap: 28px; }
      .cover-frame { min-height: 300px; }
      .metadata-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .book-main { width: min(100% - 28px, 560px); padding-top: 22px; }
      .book-hero { grid-template-columns: 1fr; padding: 20px; }
      .cover-frame { width: min(230px, 78%); min-height: 270px; margin: 0 auto; }
      .book-actions { display: grid; grid-template-columns: 1fr; }
      .book-action { width: 100%; }
      .section-heading { align-items: start; flex-direction: column; }
      .metadata-grid { grid-template-columns: 1fr 1fr; }
      .review-card-header { flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover-frame { transition: none; }
    }
  </style>
</head>
<body>
  <main class="book-main">
    <a class="back-link" href="library.html">← Back to Library</a>
    <div id="content"><div class="skeleton" aria-label="Loading book details"></div></div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script>
    const content = document.getElementById('content');
    const id = new URLSearchParams(location.search).get('id');
    const token = () => localStorage.getItem('token');
    const authHeaders = () => token() ? { Authorization: 'Bearer ' + token() } : {};
    const element = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    function revealNode(node) {
      node.setAttribute('data-reveal', '');
      requestAnimationFrame(() => node.classList.add('is-revealed'));
    }

    async function request(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.message || 'Request failed');
      return payload;
    }

    function setBusy(button, busyText, busy) {
      if (busy) {
        button.dataset.label = button.textContent;
        button.textContent = busyText;
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
      } else {
        button.textContent = button.dataset.label || button.textContent;
        button.disabled = false;
        button.removeAttribute('aria-busy');
      }
    }

    async function fileAction(endpoint, filename, button) {
      if (!token()) throw new Error('Please log in to access this book.');
      setBusy(button, filename ? 'Preparing download…' : 'Opening reader…', true);
      try {
        const response = await fetch(endpoint, { headers: authHeaders() });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.message || 'Unable to access book');
        }
        const objectUrl = URL.createObjectURL(await response.blob());
        if (filename) {
          const link = document.createElement('a');
          link.href = objectUrl;
          link.download = filename;
          link.click();
        } else {
          window.open(objectUrl, '_blank');
        }
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
      } finally {
        setBusy(button, '', false);
      }
    }

    function ratingStars(rating) {
      return '★★★★★'.slice(0, Math.max(0, Math.min(5, Number(rating) || 0))) + '☆☆☆☆☆'.slice(0, 5 - Math.max(0, Math.min(5, Number(rating) || 0)));
    }

    function metadataItem(label, value) {
      const item = element('div', undefined, 'metadata-item');
      item.append(element('span', label, 'metadata-label'), element('span', value || 'Not available', 'metadata-value'));
      return item;
    }

    function renderBook(book) {
      const hero = element('section', undefined, 'book-hero');
      revealNode(hero);
      const cover = element('div', undefined, 'cover-frame');
      if (book.cover_image) {
        const image = document.createElement('img');
        image.src = book.cover_image;
        image.alt = `${book.title || 'Book'} cover`;
        cover.append(image);
      } else {
        cover.append(element('div', book.title || 'LibraHub', 'cover-placeholder'));
      }

      const details = element('div', undefined, 'book-details');
      details.append(
        element('p', book.category?.category_name || 'LibraHub catalogue', 'book-kicker'),
        element('h1', book.title || 'Untitled book'),
      );
      const byline = element('p', undefined, 'book-byline');
      byline.append(document.createTextNode('By '), element('strong', book.author?.name || 'Unknown author'));
      details.append(byline);

      const summary = element('div', undefined, 'rating-summary');
      summary.append(element('span', ratingStars(book.rating_summary?.average), 'rating-stars'));
      summary.append(element('span', `${book.rating_summary?.average || 0}/5 · ${book.rating_summary?.count || 0} reviews`));
      details.append(summary);
      details.append(element('p', book.description || 'No description available.', 'book-description'));

      const actions = element('div', undefined, 'book-actions');
      const read = element('button', 'Read Online', 'book-action');
      const download = element('button', 'Download', 'book-action secondary');
      const bookmark = element('button', 'Checking bookmark…', 'book-action secondary');
      read.type = download.type = bookmark.type = 'button';
      actions.append(read, download, bookmark);
      details.append(actions, element('p', 'Read online opens the protected ebook viewer. Download saves a copy for offline reading.', 'action-note'));
      hero.append(cover, details);
      content.append(hero);

      read.addEventListener('click', () => fileAction(`/api/books/${encodeURIComponent(id)}/read`, null, read).catch(error => alert(error.message)));
      download.addEventListener('click', () => fileAction(`/api/books/${encodeURIComponent(id)}/download`, `${book.title}.${book.file_type || 'pdf'}`, download).catch(error => alert(error.message)));

      if (!token()) {
        bookmark.textContent = 'Log in to bookmark';
        bookmark.addEventListener('click', () => { location.href = 'login.html'; });
      } else {
        request(`/api/bookmarks/check/${encodeURIComponent(id)}`).then(result => {
          updateBookmarkButton(bookmark, result.bookmarked);
          bookmark.addEventListener('click', () => toggleBookmark(bookmark, result));
        }).catch(() => { bookmark.textContent = 'Bookmark unavailable'; bookmark.disabled = true; });
      }
    }

    function updateBookmarkButton(button, bookmarked) {
      button.textContent = bookmarked ? '♥ Bookmarked' : '♡ Bookmark';
      button.classList.toggle('bookmarked', bookmarked);
      button.setAttribute('aria-pressed', String(bookmarked));
    }

    async function toggleBookmark(button, state) {
      if (button.disabled) return;
      button.disabled = true;
      try {
        if (state.bookmarked) {
          await request(`/api/bookmarks/${id}`, { method: 'DELETE' });
        } else {
          await request('/api/bookmarks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookId: id }) });
        }
        state.bookmarked = !state.bookmarked;
        updateBookmarkButton(button, state.bookmarked);
        button.classList.remove('bookmark-pop');
        void button.offsetWidth;
        button.classList.add('bookmark-pop');
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    }

    function renderInformation(book) {
      const section = element('section', undefined, 'info-section');
      revealNode(section);
      const heading = element('div', undefined, 'section-heading');
      heading.append(element('div', undefined));
      heading.firstChild.append(element('h2', 'Book information'), element('p', 'Details supplied by the catalogue.'));
      section.append(heading);
      const grid = element('div', undefined, 'metadata-grid');
      grid.append(
        metadataItem('Author', book.author?.name),
        metadataItem('Category', book.category?.category_name),
        metadataItem('Publisher', book.publisher),
        metadataItem('Published', book.published_date ? new Date(book.published_date).toLocaleDateString() : ''),
        metadataItem('File format', (book.file_type || 'ebook').toUpperCase()),
        metadataItem('File size', book.file_size ? `${Math.round(book.file_size / 1024)} KB` : ''),
        metadataItem('Added', book.createdAt ? new Date(book.createdAt).toLocaleDateString() : ''),
        metadataItem('Rating', `${book.rating_summary?.average || 0}/5`),
      );
      section.append(grid);
      if (book.keywords?.length) {
        const keywords = element('div', undefined, 'keyword-list');
        book.keywords.forEach(keyword => keywords.append(element('span', keyword, 'keyword')));
        section.append(keywords);
      }
      content.append(section);
    }

    function currentUserId() {
      try {
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        return user?._id || user?.id || null;
      } catch { return null; }
    }

    function renderReview(review, bookId) {
      const card = element('article', undefined, 'review-card');
      const header = element('div', undefined, 'review-card-header');
      header.append(element('span', review.reader?.name || 'Reader', 'reviewer'));
      header.append(element('time', review.createdAt ? new Date(review.createdAt).toLocaleDateString() : '', 'review-date'));
      card.append(header, element('div', `${ratingStars(review.rating)} ${review.rating}/5`, 'review-rating'));
      card.append(element('p', review.comment || 'No comment provided.', 'review-text'));
      if (token() && review.reader?._id && review.reader._id === currentUserId()) {
        const actions = element('div', undefined, 'review-actions');
        const edit = element('button', 'Edit review');
        const remove = element('button', 'Delete review');
        actions.append(edit, remove);
        card.append(actions);
        edit.addEventListener('click', () => showEditForm(card, review, bookId));
        remove.addEventListener('click', async () => {
          if (!confirm('Delete your review?')) return;
          remove.disabled = true;
          try { await request(`/api/feedback/${encodeURIComponent(review._id)}`, { method: 'DELETE' }); card.remove(); }
          catch (error) { alert(error.message); remove.disabled = false; }
        });
      }
      return card;
    }

    function showEditForm(card, review, bookId) {
      card.replaceChildren();
      const form = createReviewForm(bookId, review);
      card.append(form);
    }

    function createReviewForm(bookId, existingReview) {
      const form = document.createElement('form');
      form.className = 'review-form';
      const title = element('h3', existingReview ? 'Edit your review' : 'Share your review');
      const picker = element('div', undefined, 'star-picker');
      let selectedRating = existingReview?.rating || 0;
      for (let value = 1; value <= 5; value += 1) {
        const star = element('button', '★', 'star-option');
        star.type = 'button';
        star.setAttribute('aria-label', `${value} star${value === 1 ? '' : 's'}`);
        star.classList.toggle('selected', value <= selectedRating);
        star.addEventListener('click', () => {
          selectedRating = value;
          picker.querySelectorAll('button').forEach((option, index) => option.classList.toggle('selected', index < value));
        });
        picker.append(star);
      }
      const comment = document.createElement('textarea');
      comment.placeholder = 'What did you think about this book?';
      comment.required = true;
      comment.value = existingReview?.comment || '';
      const submit = element('button', existingReview ? 'Save changes' : 'Submit review', 'book-action');
      submit.type = 'submit';
      const feedback = element('p', '', 'form-feedback');
      form.append(title, picker, comment, submit, feedback);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        feedback.className = 'form-feedback';
        if (!selectedRating) { feedback.classList.add('error'); feedback.textContent = 'Please select a rating from 1 to 5 stars.'; return; }
        setBusy(submit, existingReview ? 'Saving…' : 'Submitting…', true);
        try {
          const url = existingReview ? `/api/feedback/${encodeURIComponent(existingReview._id)}` : '/api/feedback';
          const method = existingReview ? 'PUT' : 'POST';
          await request(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookId, rating: selectedRating, comment: comment.value.trim() }) });
          feedback.classList.add('success');
          feedback.textContent = 'Saved successfully. Refreshing reviews…';
          setTimeout(() => loadBook(), 450);
        } catch (error) {
          feedback.classList.add('error');
          feedback.textContent = error.message;
          setBusy(submit, '', false);
        }
      });
      return form;
    }

    async function loadReviews(book, bookId) {
      const payload = await request(`/api/feedback/book/${encodeURIComponent(bookId)}`);
      const section = element('section', undefined, 'reviews-section');
      revealNode(section);
      const heading = element('div', undefined, 'section-heading');
      const headingCopy = element('div');
      headingCopy.append(element('h2', 'Reader reviews'), element('p', 'Thoughts from the LibraHub community.'));
      const summary = element('div', undefined, 'review-summary');
      summary.append(element('span', `${payload.rating_summary?.average || 0}/5`, 'review-average'));
      summary.append(element('span', `${payload.rating_summary?.count || 0} ${payload.rating_summary?.count === 1 ? 'review' : 'reviews'}`, 'review-count'));
      heading.append(headingCopy, summary);
      section.append(heading);
      const list = element('div', undefined, 'review-list');
      const reviews = payload.data || [];
      if (reviews.length) reviews.forEach(review => {
        const reviewCard = renderReview(review, bookId);
        reviewCard.setAttribute('data-reveal', '');
        reviewCard.classList.add('is-revealed');
        list.append(reviewCard);
      });
      else list.append(element('div', 'No reviews yet. Be the first reader to share your thoughts.', 'review-empty'));
      section.append(list);
      if (token()) section.append(createReviewForm(bookId));
      else section.append(element('p', 'Log in to leave a review.', 'login-review'));
      content.append(section);
    }

    async function loadBook() {
      content.replaceChildren(element('div', undefined, 'skeleton'));
      if (!id) { content.replaceChildren(element('p', 'Book ID is required.', 'review-empty')); return; }
      try {
        const payload = await request(`/api/books/${encodeURIComponent(id)}`);
        const book = payload.data;
        content.replaceChildren();
        renderBook(book);
        renderInformation(book);
        await loadReviews(book, id);
      } catch (error) {
        content.replaceChildren(element('div', error.message, 'review-empty'));
      }
    }

    loadBook();
  </script>
</body>
</html>
